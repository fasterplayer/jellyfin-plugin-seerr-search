description: >
  Ajoute une section « Disponible sur demande » sous les résultats de recherche du client web
  Jellyfin. Les titres viennent de Seerr et chaque demande est créée au nom du compte Seerr lié
  à l'utilisateur Jellyfin connecté : aucune seconde connexion, aucun mot de passe, et les quotas
  et permissions de Seerr continuent de s'appliquer par utilisateur.
