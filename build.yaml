overview: "Seerr results under the Jellyfin search, with a Request button."
description: >
  Adds an "Available on request" section under the search results of the Jellyfin web client.
  Titles come from Seerr, and each request is created as the Seerr account linked to the
  signed-in Jellyfin user: no second sign-in, no password, and Seerr's quotas and permissions
  keep applying per user. The Seerr API key stays on the server.
