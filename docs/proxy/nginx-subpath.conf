# Seerr Search - nginx, Jellyfin under a sub-path (https://home.example.com/jellyfin) and Seerr on its own host name.
#
# 1. Jellyfin: Dashboard -> Networking -> "Base URL" = /jellyfin, save, restart Jellyfin. (Jellyfin supports this natively;
#    do NOT strip the prefix in nginx.)
# 2. Seerr does NOT support running under a sub-path: give it a host name of its own (seerr.example.com).
# 3. In the plugin: Public Jellyfin URL = https://home.example.com/jellyfin, Public Seerr URL = https://seerr.example.com.
#
# Replace the names, and jellyfin:8096 / seerr:5055 by the address of each application as nginx sees it.
# TLS: add `listen 443 ssl;` and your certificate lines exactly as you do for any other site.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name home.example.com;

    # No URI after the address: the /jellyfin prefix is passed to Jellyfin as it is.
    location /jellyfin/ {
        proxy_pass http://jellyfin:8096;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
    }

    location = /jellyfin {
        return 302 /jellyfin/;
    }
}

server {
    listen 80;
    server_name seerr.example.com;

    # Specific to Seerr Search: /SeerrSearch/ goes to JELLYFIN, and the Jellyfin base URL is added in front of it.
    location /SeerrSearch/ {
        proxy_pass http://jellyfin:8096/jellyfin/SeerrSearch/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://seerr:5055;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}