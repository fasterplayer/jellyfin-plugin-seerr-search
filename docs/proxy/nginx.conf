# Seerr Search - nginx (one server block per host).
# Replace jellyfin.example.com / seerr.example.com by your names, and jellyfin:8096 / seerr:5055 by the
# address of each application as nginx sees it (Docker service name, or IP:port).
# TLS: add `listen 443 ssl;` and your certificate lines exactly as you do for any other site.

# Needed once, in the http context (conf.d files are already inside it).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name jellyfin.example.com;

    location / {
        proxy_pass http://jellyfin:8096;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
    }
}

server {
    listen 80;
    server_name seerr.example.com;

    # The only line that is specific to Seerr Search: this path goes to JELLYFIN, not to Seerr.
    # It is what lets the plugin sign the user in to Seerr (the session cookie is then set by Seerr's own host).
    location /SeerrSearch/ {
        proxy_pass http://jellyfin:8096;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://seerr:5055;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}